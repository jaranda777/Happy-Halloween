
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09080c">
<title>Happy Halloween, Sister! 👻</title>
<style>
:root{color-scheme:dark;--lav:#d9b4ff;--orange:#ff9b3d}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 25%,#38202d 0%,#160c17 47%,#050507 100%);color:#f8ecff;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;overflow-x:hidden}.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#e9caff;box-shadow:0 0 10px #d8b0ff;animation:twinkle 2.5s ease-in-out infinite alternate}.moon{position:absolute;right:9%;top:7%;width:74px;height:74px;border-radius:50%;background:#f7e3bc;box-shadow:0 0 35px #e3b6ff99,0 0 90px #ad5cf866}.moon:after{content:"";position:absolute;width:70px;height:70px;top:-14px;left:-20px;border-radius:50%;background:#1a0d31}.wrap{position:relative;z-index:2;max-width:660px;margin:auto;padding:45px 18px 60px;text-align:center}.eyebrow{letter-spacing:.32em;color:#e0b7ff;font-size:.78rem;text-transform:uppercase}h1{font-size:clamp(2.3rem,9vw,4.6rem);line-height:1.1;margin:16px 0 12px;color:#e9e3e5;text-shadow:0 0 18px #b51c3988,0 0 40px #8b0d2777}h2{font-size:clamp(1.3rem,5vw,2rem);color:#e4baff;margin:0 0 16px}.intro{font-size:1.1rem;line-height:1.65;max-width:510px;margin:0 auto 22px}.scene{height:260px;position:relative;display:flex;align-items:center;justify-content:center}.pumpkin{position:relative;border:0;background:transparent;font-size:clamp(115px,31vw,180px);cursor:pointer;filter:drop-shadow(0 0 25px #e2e2ff99);animation:bob 3s ease-in-out infinite;touch-action:manipulation;transition:filter .25s,transform .25s}.pumpkin:active{transform:scale(.93)}.pumpkin.glow{filter:drop-shadow(0 0 45px #ffffff) drop-shadow(0 0 70px #a90d32)}.ghost{position:absolute;font-size:65px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 12px #c5b7ff77);pointer-events:none}.g1{left:4%;top:18%}.g2{right:3%;top:8%;animation-delay:-2s;font-size:56px}.bat{position:absolute;font-size:30px;top:8%;left:30%;animation:fly 7s ease-in-out infinite}.hint{font-size:.85rem;color:#d3b4ea;margin:-10px 0 20px}.panel{background:#1a1018dd;border:1px solid #9b354888;box-shadow:0 0 30px #8d4aff26,inset 0 0 24px #ab5bf111;border-radius:24px;padding:25px 18px;backdrop-filter:blur(8px)}.panel p{font-size:1.16rem;line-height:1.7;margin:5px auto 18px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button.action{border:1px solid #dfb3ff;background:linear-gradient(135deg,#73263c,#2b111e);color:white;border-radius:999px;padding:13px 18px;font:700 1rem system-ui;cursor:pointer;min-height:48px;box-shadow:0 5px 22px #05020b66}button.action:active{transform:scale(.96)}button.action.orange{background:linear-gradient(135deg,#a72e3e,#4e1427);border-color:#ffb27b}.surprise{margin:18px auto 0;min-height:32px;color:#ffe0a8;font-weight:700;font-size:1.1rem}.footer{font-size:.85rem;color:#bda1d3;margin-top:24px}.spark{position:fixed;z-index:20;pointer-events:none;font-size:25px;animation:burst 1.5s ease-out forwards}@keyframes twinkle{from{opacity:.2;transform:scale(.65)}to{opacity:1;transform:scale(1.4)}}@keyframes bob{50%{transform:translateY(-11px)}}@keyframes float{50%{transform:translateY(-20px) rotate(8deg)}}@keyframes fly{50%{transform:translate(85px,35px) rotate(12deg)}}@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(240deg) scale(1.3)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}@media(max-width:380px){.ghost{font-size:45px}.scene{height:220px}.panel{padding:20px 12px}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"><div class="moon"></div></div>
<main class="wrap"><div class="eyebrow">A message from the other side</div><h1>Happy Halloween!</h1><h2>Sister 💜</h2><div class="scene"><span class="ghost g1" aria-hidden="true">🕷️</span><span class="bat" aria-hidden="true">🦇</span><button class="pumpkin" id="pumpkin" aria-label="Tap the ghost for a haunting surprise">👻</button><span class="ghost g2" aria-hidden="true">🦇</span></div><div class="hint">🩸 Tap the ghost... if you dare. 🩸</div><section class="panel" aria-label="Halloween greeting"><p>Happy Halloween! 👻<br>The night is watching. Choose your fate... if you dare. 🩸</p><div class="actions"><button class="action orange" id="treat">🍬 Trick or Treat!</button><button class="action" id="magic">🕯️ Summon a Spirit</button></div><div class="surprise" id="surprise" role="status" aria-live="polite"></div></section><div class="footer">The haunting begins at midnight. 🕸️</div></main>
<script>
(function(){'use strict';const sky=document.getElementById('sky'),surprise=document.getElementById('surprise'),pumpkin=document.getElementById('pumpkin');for(let i=0;i<65;i++){const s=document.createElement('span');s.className='star';s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';s.style.animationDelay=(Math.random()*4)+'s';s.style.animationDuration=(1.5+Math.random()*3)+'s';sky.appendChild(s)}function confetti(emoji,count){for(let i=0;i<count;i++){const el=document.createElement('span');el.className='spark';el.textContent=emoji[Math.floor(Math.random()*emoji.length)];el.style.left=(15+Math.random()*70)+'vw';el.style.top=(25+Math.random()*45)+'vh';el.style.setProperty('--x',((Math.random()-.5)*320)+'px');el.style.setProperty('--y',(-80-Math.random()*230)+'px');document.body.appendChild(el);setTimeout(()=>el.remove(),1600)}}let n=0;pumpkin.addEventListener('click',()=>{pumpkin.classList.toggle('glow');surprise.textContent=pumpkin.classList.contains('glow')?'👻 YOU WOKE IT. Something is standing behind you...':'🕯️ It vanished... but you can still hear it breathing.';confetti(['👁️','🩸','🕸️'],18)});document.getElementById('treat').addEventListener('click',()=>{const treats=['🩸 TRICK: Your phone rings. The caller knows your name.','🍬 TREAT: You survived the night. Claim your candy.','🔪 TRICK: Footsteps echo behind you... then stop.','🕯️ TREAT: The spirits spare you this Halloween.','👁️ TRICK: The reflection in the window just blinked.','🍫 TREAT: A chocolate offering keeps the monsters away.','👻 TRICK: The ghost whispers: I see you.','🦇 TREAT: You escape before the clock strikes midnight.'];surprise.textContent=treats[n++%treats.length];confetti(['🍬','🍭','🍫','💜'],24)});document.getElementById('magic').addEventListener('click',()=>{surprise.textContent='🕯️ The candles go out. A whisper says: Happy Halloween, Sister... 👁️';confetti(['🕯️','🩸','👁️','🦇'],28)})})();
</script>
</body></html>
